# ==============================================================================
# FreqUI 生产环境 Nginx 配置
# 功能特性：
# 1. 前端 SPA 路由 history 模式支持 (try_files)
# 2. 静态资源长效 Gzip 压缩与强缓存
# 3. /freq-trade/ fixed local proxy (remote URLs use direct CORS)
# 4. Upstream keepalive pool — reuse TCP connections to Freqtrade
# ==============================================================================

# ── Keepalive connection pool to Freqtrade API ──
upstream freqtrade_backend {
    server ft-futures-bot:8081;
    keepalive 16;
}

server {
    listen 80;
    server_name localhost;

    # 启用 Gzip 高效压缩
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # 静态前端页面根目录
    root /usr/share/nginx/html;
    index index.html;

    # --------------------------------------------------------------------------
    # 1. 前端 SPA 单页应用路由匹配
    # --------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源强缓存 (1 年)
    location ~* \.(?:css|js|woff2?|svg|png|jpg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Fixed local proxy for Freqtrade API.
    # Handles both /freq-trade/ and /api/v1/ routes seamlessly.
    location /freq-trade/ {
        rewrite ^/freq-trade/api/v1/(.*)$ /api/v1/$1 break;
        rewrite ^/freq-trade/(.*)$ /api/v1/$1 break;
        proxy_pass http://freqtrade_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $proxy_host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Origin $http_origin;
        proxy_read_timeout 60s;
    }

    location /api/v1/ {
        proxy_pass http://freqtrade_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $proxy_host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Origin $http_origin;
        proxy_read_timeout 60s;
    }

    # 错误页面处理
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
