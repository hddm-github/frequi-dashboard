upstream freqtrade_backend {
    server ft-binance-sg-proxy:8081;
    keepalive 16;
}

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|woff2?|svg|png|jpg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Local same-origin path is forwarded through SSH tunnel to Singapore VPS.
    location /api/v1/ {
        proxy_pass http://freqtrade_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $proxy_host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # Remote Freqtrade API proxy. Target is supplied by the dashboard request.
    location /api-proxy/ {
        set $target_url $http_x_target_url;
        if ($target_url = "") {
            return 400 '{"error":"Missing x-target-url header"}';
        }
        resolver 127.0.0.11 8.8.8.8 1.1.1.1 valid=300s ipv6=off;
        rewrite ^/api-proxy/(.*)$ /$1 break;
        proxy_pass $target_url;
        proxy_http_version 1.1;
        proxy_set_header Host $proxy_host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
