# ==============================================================================
# FreqUI 生产环境 Nginx 配置
# 功能特性：
# 1. 前端 SPA 路由 history 模式支持 (try_files)
# 2. 静态资源长效 Gzip 压缩与强缓存
# 3. /share-api/ 只读免密安全反向代理：
#    - 服务端自动注入 Basic Auth 凭据，访客浏览器完全看不到密钥
#    - 强制拦截除 GET 以外的所有写操作 (POST/DELETE/PUT)，彻底防止任何平仓或控制破坏
# 4. /api-proxy/ 通用直连代理（供登录模式跨域使用）
# ==============================================================================

server {
    listen 80;
    server_name localhost;

    # 启用 Gzip 高效压缩
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # 静态前端页面根目录
    root /usr/share/nginx/html;
    index index.html;

    # --------------------------------------------------------------------------
    # 1. 前端 SPA 单页应用路由匹配
    # --------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源强缓存 (1 年)
    location ~* \.(?:css|js|woff2?|svg|png|jpg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # --------------------------------------------------------------------------
    # 2. 只读分享免密代理 (Share Read-Only Proxy)
    #    访客访问 /share-api/ 无需密码，服务端自动追加 Authorization，并屏蔽一切写操作
    # --------------------------------------------------------------------------
    location /share-api/ {
        # 【关键安全防线】：只放行 GET 查询请求！拦截平仓、止损、启停等一切破坏性写入
        limit_except GET OPTIONS {
            deny all;
        }

        # 预检请求快速通过
        if ($request_method = 'OPTIONS') {
            return 204;
        }

        # 去除 /share-api 前缀，转发至实际 Freqtrade API
        # Freqtrade api_server.listen_port = 8081 (set in user_data/config.json)
        proxy_pass http://ft-futures-bot:8081/api/v1/;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 【安全核心】：在此处服务器端注入 Basic Auth 密钥！
        # 访客在浏览器 Network 里完全看不到此 Header，密钥绝不外泄
        # 格式为: "Basic " + base64("用户名:密码")
        # 示例: freqtrade:freqtrade -> "Basic ZnJlcXRyYWRlOmZyZXF0cmFkZQ=="
        proxy_set_header Authorization "Basic ZnJlcXRyYWRlOmZyZXF0cmFkZQ==";

        # 超时保护
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # --------------------------------------------------------------------------
    # 3. 动态跨域中转代理 (供管理员在浏览器直接输入其他远程机器人的 IP 直连)
    # --------------------------------------------------------------------------
    location /api-proxy/ {
        # 根据请求 Header 里的 x-target-url 动态转发
        set $target_url $http_x_target_url;

        if ($target_url = "") {
            return 400 '{"error":"Missing x-target-url header"}';
        }

        # 动态解析与代理（client already sends full /api/v1/<endpoint> path;
        # we strip the /api-proxy/ prefix and forward /api/v1/... as-is）
        resolver 8.8.8.8 1.1.1.1 valid=300s ipv6=off;
        rewrite ^/api-proxy/(.*)$ /$1 break;
        proxy_pass $target_url;

        proxy_http_version 1.1;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 错误页面处理
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
